<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Parity — a transparent digital home for your savings club (mukando/round). Track contributions, loans, and payouts together." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Parity — Save Together, Grow Together</title>
    <script>
      (function () {
        // Signed-out visitors always get the OS/browser theme; the saved
        // preference only applies once there's an active session.
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isAuthenticated = !!localStorage.getItem('parity-token');
        var stored = isAuthenticated ? localStorage.getItem('parity-theme') : null;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
